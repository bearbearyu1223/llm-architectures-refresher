[project]
name = "llm-architectures-refresher"
version = "0.1.0"
description = "Runnable, laptop-sized demos for the LLM Architectures blog series"
readme = "README.md"
requires-python = ">=3.11,<3.13"

# Core deps run everywhere: Apple Silicon (MPS) and Linux + NVIDIA (CUDA).
# The default PyPI torch wheel is MPS-enabled on macOS/arm64 and CUDA-enabled
# on linux/x86_64, so a single pin covers both targets.
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Demos that need a real NVIDIA GPU (4-bit bitsandbytes, HF model loading).
# bitsandbytes has no usable Apple Silicon build, so it is linux-gated.
cuda = [
    "transformers>=4.44",
    "accelerate>=0.34",
    "bitsandbytes>=0.43; sys_platform == 'linux'",
]

[project.scripts]
demo01 = "llmrefresher.demos.d01_attention:main"
demo02 = "llmrefresher.demos.d02_kv_cache:main"
demo03 = "llmrefresher.demos.d03_flash_attention:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmrefresher"]

[tool.uv]
package = true
